<head>

<title>Legends School & Kindergarten — SMS</title>
<style>
:root{--navy:#062c55;--navy2:#0a3d70;--blue:#1976d2;--gold:#f4bd28;--bg:#f4f8fc;--text:#12385d;--mut:#66809b;--line:#dbe7f2;--green:#21a45a;--red:#e53935;--orange:#f5a623;--purple:#7444d8;--teal:#16a7b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
.layout{min-height:100vh;display:flex}.sidebar{position:fixed;right:0;top:0;bottom:0;width:236px;background:linear-gradient(180deg,#06294e,#073765 70%,#05264a);color:#fff;overflow:auto;border-left:1px solid #ffffff18}.logo{height:132px;padding:12px;text-align:center;border-bottom:1px solid #ffffff22}.logo img{max-height:78px;max-width:145px;object-fit:contain}.logo b{display:block;font-size:18px;letter-spacing:1px}.logo small{font-size:9px}.nav{padding:8px}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:right;padding:9px 12px;border-radius:7px;margin:1px 0;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button:hover{background:#ffffff12}.nav button.active{background:linear-gradient(90deg,#f5b82b,#f6cf5c);color:#082d54;font-weight:bold;box-shadow:0 2px 7px #0003}.nav .ico{width:25px;font-size:17px;text-align:center}.nav .arr{margin-right:auto}.main{margin-right:236px;width:calc(100% - 236px);min-width:0}.top{height:100px;background:linear-gradient(115deg,#072d55,#0b467d);color:#fff;display:flex;align-items:center;padding:12px 26px;justify-content:space-between;border-bottom:4px solid var(--gold)}.schooltitle{font-size:23px;font-weight:800}.schooltitle small{display:block;font-size:14px;font-weight:400;margin-top:5px}.topmid{font-size:13px}.topright{display:flex;align-items:center;gap:12px}.lang{border:1px solid #ffffff66;border-radius:8px;padding:9px 12px}.user{display:flex;align-items:center;gap:8px}.avatar{width:42px;height:42px;border-radius:50%;background:#f5c744;color:#17385a;display:grid;place-items:center;font-size:22px}.content{padding:16px 18px 58px}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.pagehead h1{font-size:22px;margin:0}.date{font-size:12px;color:var(--mut)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{min-height:124px;border-radius:10px;color:#fff;padding:13px;position:relative;overflow:hidden;box-shadow:0 3px 10px #173a5c22}.kpi b{font-size:27px;display:block;margin:6px 0}.kpi span{font-size:11px}.kpi .bigico{position:absolute;left:12px;top:13px;width:49px;height:49px;border-radius:50%;background:#ffffff2b;display:grid;place-items:center;font-size:24px}.c1{background:linear-gradient(135deg,#1679df,#0d60bd)}.c2{background:linear-gradient(135deg,#35b85c,#159348)}.c3{background:linear-gradient(135deg,#7d46e2,#6631bd)}.c4{background:linear-gradient(135deg,#f2ad22,#ec8b08)}.c5{background:linear-gradient(135deg,#1cb6c7,#0c94a8)}.c6{background:linear-gradient(135deg,#ef4a49,#d52f31)}.grid{display:grid;grid-template-columns:1.05fr .95fr .72fr;gap:10px;margin-top:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #173a5c0d;overflow:hidden}.ptitle{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;display:flex;justify-content:space-between}.ptitle a{font-size:10px;color:var(--blue);cursor:pointer}.pbody{padding:12px}.tablebox{overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{border-bottom:1px solid #edf2f6;padding:8px 7px;font-size:10px;white-space:nowrap}.tbl th{background:#edf5fb;color:#17466f}.notice{padding:8px 4px;border-bottom:1px solid #e8eef4;font-size:11px;display:flex;gap:8px;align-items:center}.ni{font-size:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.quick button{border:0;border-radius:8px;padding:12px 5px;background:linear-gradient(135deg,#07335e,#0d4e85);color:#fff;cursor:pointer;font-size:10px;min-height:68px}.quick button span{display:block;font-size:20px;margin-bottom:5px}.barrow{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:11px}.bar{height:9px;background:#e9eff5;border-radius:10px;overflow:hidden;flex:1}.bar i{display:block;height:100%}.legend{display:flex;gap:16px;justify-content:center;font-size:10px;margin-top:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.donut{width:155px;height:155px;border-radius:50%;margin:auto;background:conic-gradient(var(--green) 0 91%,var(--red) 91% 100%);display:grid;place-items:center}.donut:after{content:"";width:98px;height:98px;border-radius:50%;background:#fff}.donuttext{position:absolute;text-align:center;font-weight:bold;font-size:20px}.donutwrap{position:relative;width:155px;margin:auto}.donutlegend{margin-top:8px}.dl{display:flex;justify-content:space-between;padding:5px 8px;font-size:11px}.footer{position:fixed;bottom:0;right:236px;left:0;background:#062c55;color:#fff;height:44px;display:flex;align-items:center;justify-content:space-around;font-size:11px;border-top:1px solid #ffffff20}.online{color:#59d878}.section{display:none}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid #ccdbe8;border-radius:6px;padding:9px;background:#fff;font-family:inherit}.toolbar input{min-width:230px}.btn{border:0;border-radius:6px;padding:9px 13px;cursor:pointer;background:var(--blue);color:#fff}.gold{background:var(--gold);color:#17385a}.red{background:var(--red)}.gray{background:#71859a}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{font-size:10px;color:var(--mut)}.form input,.form select,.form textarea{width:100%;margin-top:4px}.full{grid-column:1/-1}.modalbg{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:center;justify-content:center}.modal{background:#fff;width:min(760px,94vw);max-height:92vh;overflow:auto;border-radius:12px;padding:20px}.foot{display:flex;gap:8px;margin-top:15px}.empty{text-align:center;color:var(--mut);padding:30px}.pill{padding:3px 7px;border-radius:12px;background:#e7f7ec;color:#168448}.actions button{border:0;border-radius:5px;padding:5px 7px;margin-left:3px;cursor:pointer}.profile{display:grid;grid-template-columns:260px 1fr;gap:10px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f6f9fc;border:1px solid var(--line);border-radius:7px;padding:12px}.stat b{display:block;font-size:21px;margin-top:5px}.hidden{display:none!important}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.grid .panel:last-child{grid-column:1/-1}}
@media(max-width:700px){.sidebar{position:static;width:100%}.layout{display:block}.main{margin:0;width:100%}.top{height:auto;gap:8px;flex-wrap:wrap}.footer{position:static}.cards,.grid,.form,.profile{grid-template-columns:1fr}.quick{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="login" class="modalbg" style="display:flex;background:linear-gradient(135deg,#05294e,#0c5a96)">
  <div class="modal" style="max-width:380px;text-align:center"><img src="assets/legends-logo.jpeg" alt="Legends School & Kindergarten" style="width:220px;max-height:170px;object-fit:contain;margin:0 auto 10px;display:block"><h2 style="margin:4px 0;color:#062c55">نظام إدارة المدرسة</h2><h3>Legends School Management System</h3><input id="lu" placeholder="اسم المستخدم" style="width:100%;padding:11px;margin:5px 0"><input id="lp" type="password" placeholder="كلمة المرور" style="width:100%;padding:11px;margin:5px 0"><button class="btn gold" style="width:100%;margin-top:8px" onclick="login()">دخول النظام</button><div id="le" style="color:#d33;margin-top:7px;font-size:11px"></div></div>
</div>
<div id="app" class="layout hidden">
<aside class="sidebar">
  <div class="logo">
    <img src="assets/legends-logo.jpeg" alt="Legends logo" style="width:150px;height:100px;object-fit:contain;border-radius:6px;background:#fff"><b>LEGENDS</b><small>PRIVATE SCHOOL & KINDERGARTEN</small>
  </div>
  <div id="nav" class="nav"></div>
</aside>
<main class="main">
<header class="top">
  <div><div class="schooltitle">Legends School & Kindergarten<small>Private School & Kindergarten</small></div></div>
  <div class="topmid">📍 Erbil - Iraq</div>
  <div class="topright"><div class="lang">🇹🇯 كردي &nbsp; 🇮🇶 عربي &nbsp; 🇬🇧 English</div><div>🔔 <sup>3</sup></div><button class="btn red" onclick="logout()" style="font-weight:bold">🚪 تسجيل الخروج</button><div class="user"><div class="avatar">👤</div><div>مدير النظام<br><small>المشرف العام</small></div></div></div>
</header>
<div class="content">
<div class="pagehead"><h1 id="title">🏠 لوحة التحكم</h1><div class="date" id="date"></div></div>
<div id="content"></div>
</div>
</main></div>
<div id="mb" class="modalbg"><div class="modal"><h2 id="mt"></h2><div id="mf"></div><div class="foot"><button class="btn gold" onclick="save()">حفظ</button><button class="btn gray" onclick="closeM()">إلغاء</button></div></div></div>
<script>
const menu=[
["dashboard","🏠","لوحة التحكم"],["students","👥","الطلاب"],["teachers","👨‍🏫","المدرسون"],["parents","👨‍👩‍👧","أولياء الأمور"],
["classes","🏫","المراحل والصفوف"],["subjects","📚","المواد الدراسية"],["schedule","📅","الجدول الدراسي"],["attendance","🛡️","الحضور والغياب"],
["exams","📝","الامتحانات والدرجات"],["fees","💰","الرسوم والحسابات"],["reports","📋","التقارير"],["certificates","🎓","الشهادات"],
["users","👥","المستخدمون والصلاحيات"],["settings","⚙️","إعدادات النظام"],["backup","💾","النسخ الاحتياطي"],["database","🗄️","قاعدة البيانات والشبكة"]];
const schema={
students:[["studentNo","رقم الطالب","text"],["name","الاسم الكامل","text"],["gender","الجنس","select","ذكر,أنثى"],["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["className","الصف","text"],["section","الشعبة","text"],["birth","تاريخ الميلاد","date"],["parent","ولي الأمر","text"],["phone","هاتف ولي الأمر","text"],["status","الحالة","select","فعال,منقول,متخرج,منسحب"]],
teachers:[["employeeNo","رقم الموظف","text"],["name","اسم المدرس","text"],["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["subject","المادة","text"],["phone","الهاتف","text"],["email","البريد الإلكتروني","email"],["qualification","المؤهل","text"],["status","الحالة","select","فعال,غير فعال"]],
parents:[["name","اسم ولي الأمر","text"],["phone","الهاتف","text"],["email","البريد الإلكتروني","email"],["children","أسماء الأبناء","text"],["address","العنوان","text"]],
classes:[["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["name","الصف","text"],["section","الشعبة","text"],["room","القاعة","text"],["teacher","المربي","text"]],
subjects:[["code","الرمز","text"],["name","المادة","text"],["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["teacher","المدرس","text"]],
schedule:[["day","اليوم","select","الأحد,الإثنين,الثلاثاء,الأربعاء,الخميس"],["className","الصف","text"],["section","الشعبة","text"],["subject","المادة","text"],["teacher","المدرس","text"],["start","من","time"],["end","إلى","time"]],
attendance:[["date","التاريخ","date"],["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["student","الطالب","text"],["className","الصف","text"],["status","الحالة","select","حاضر,غائب,متأخر"],["note","ملاحظة","text"]],
exams:[["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["className","الصف","text"],["student","الطالب","text"],["term","الفصل","select","الأول,الثاني,الثالث"],["subject","المادة","text"],["score","الدرجة من 100","number"],["academicYear","العام الدراسي","text"]],
grades:[["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["className","الصف","text"],["student","الطالب","text"],["term","الفصل","select","الأول,الثاني,الثالث"],["subject","المادة","text"],["score","الدرجة","number"],["max","من","number"],["note","ملاحظة","text"]],
fees:[["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["className","الصف","text"],["student","الطالب","text"],["description","البيان","text"],["amount","المبلغ","number"],["paid","المدفوع","number"],["remaining","المتبقي","number"],["date","التاريخ","date"],["note","ملاحظة","text"]],
certificates:[["stage","المرحلة","select","الروضة,الأساسي,الإعدادية"],["className","الصف","text"],["student","الطالب","text"],["academicYear","العام الدراسي","text"],["note","ملاحظة","text"]],
users:[["name","الاسم","text"],["username","اسم الدخول","text"],["role","الصلاحية","select","مدير النظام,مدير المدرسة,محاسب,مدرس,موظف إداري"],["active","الحالة","select","فعال,غير فعال"]]
};
let db=JSON.parse(localStorage.getItem("LEGENDS_SMS_V3")||"null");
if(!db) db=Object.fromEntries(Object.keys(schema).map(k=>[k,[]]));
db.users=db.users?.length?db.users:[{id:"admin",name:"مدير النظام",username:"admin",role:"مدير النظام",active:"فعال"}];
// V8 migration
db.exams=db.exams||[]; db.grades=db.grades||[]; db.certificates=db.certificates||[]; db.subjects=db.subjects||[];
const defaultSubjects=["اللغة العربية","اللغة الكوردية","اللغة الإنجليزية","الرياضيات","العلوم","الاجتماعيات","التربية الإسلامية","الحاسوب"];
if(!db.subjects.length) defaultSubjects.forEach((name,i)=>db.subjects.push({id:"sub-"+i,name,code:"S"+(i+1),stage:"الأساسي",teacher:""}));
let page="dashboard",edit=null,typeNow=null;
const $=id=>document.getElementById(id);
function saveDB(){localStorage.setItem("LEGENDS_SMS_V3",JSON.stringify(db))}
function login(){if(lu.value==="admin"&&lp.value==="1234"){$("login").style.display="none";$("app").classList.remove("hidden");render()}else le.textContent="اسم المستخدم أو كلمة المرور غير صحيحة"}
function logout(){$("app").classList.add("hidden");$("login").style.display="flex";$("lu").value="";$("lp").value="";$("le").textContent="";$("lu").focus()}
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function nav(){ $("nav").innerHTML=menu.map(m=>`<button data-p="${m[0]}" onclick="go('${m[0]}')"><span class="ico">${m[1]}</span>${m[2]}<span class="arr">‹</span></button>`).join("")}
function go(p){page=p;document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===p));render()}
function render(){let m=menu.find(x=>x[0]===page);$("title").textContent=(m?m[1]+" ":"")+" "+(m?m[2]:"لوحة التحكم");$("date").textContent=new Date().toLocaleDateString("ar-IQ",{weekday:"long",year:"numeric",month:"2-digit",day:"2-digit"});if(page==="dashboard")dashboard();else if(page==="reports")reports();else if(page==="backup")backupPage();else if(page==="database")databasePage();else if(page==="settings")settingsPage();else if(page==="exams")examsPage();else if(page==="certificates")certificatesPage();else crud(page)}
function total(k,fn){return (db[k]||[]).filter(fn||(()=>true)).length}
function money(k,field){return (db[k]||[]).reduce((s,x)=>s+(+x[field]||0),0)}
function dashboard(){
 let st=db.students||[], active=st.filter(x=>x.status==="فعال").length, teachers=db.teachers.length, classes=db.classes.length||12;
 let today=new Date().toISOString().slice(0,10), at=db.attendance.filter(x=>x.date===today), abs=at.filter(x=>x.status==="غائب").length;
 let amount=money("fees","amount"),paid=money("fees","paid"),remaining=money("fees","remaining");
 let stages=["الروضة","الأساسي","الإعدادية"], counts=stages.map(s=>st.filter(x=>x.stage===s).length);
 let h=at.filter(x=>x.status==="حاضر").length, late=at.filter(x=>x.status==="متأخر").length;
 let totalAtt=h+abs+late||200, hp=Math.round(h/totalAtt*100), ap=Math.round(abs/totalAtt*100);
 $("content").innerHTML=`
 <div class="cards">
  <div class="kpi c1">👥 <span>إجمالي الطلاب</span><b>${st.length||200}</b><span>طالب وطالبة</span><div class="bigico">👥</div></div>
  <div class="kpi c2">👨‍🏫 <span>المدرسون</span><b>${teachers||30}</b><span>مدرس ومدرسة</span><div class="bigico">👤</div></div>
  <div class="kpi c3">🏫 <span>المراحل والصفوف</span><b>${classes}</b><span>مرحلة وصف</span><div class="bigico">🏫</div></div>
  <div class="kpi c4">📅 <span>الغياب اليوم</span><b>${abs||0}</b><span>طالب غائب</span><div class="bigico">📅</div></div>
  <div class="kpi c5">💵 <span>الإيرادات</span><b>${amount.toLocaleString()}</b><span>د.ع</span><div class="bigico">💲</div></div>
  <div class="kpi c6">💳 <span>المتبقي</span><b>${remaining.toLocaleString()}</b><span>د.ع</span><div class="bigico">💳</div></div>
 </div>
 <div class="grid">
  <div class="panel"><div class="ptitle">📊 عدد الطلاب حسب المرحلة <a onclick="go('students')">عرض الكل</a></div><div class="pbody">
   ${stages.map((s,i)=>`<div class="barrow"><span style="width:70px">${s}</span><div class="bar"><i style="width:${st.length?Math.max(2,counts[i]/st.length*100):[30,55,15][i]}%;background:${["#2689e8","#2db455","#8149d8"][i]}"></i></div><b>${counts[i]}</b></div>`).join("")}
   <div style="height:155px;display:flex;align-items:flex-end;gap:30px;justify-content:center;padding:8px 20px">${counts.map((n,i)=>`<div style="width:65px;height:${Math.max(8,(n/(Math.max(...counts)||1))*120)}px;background:${["#2689e8","#2db455","#8149d8"][i]};border-radius:5px 5px 0 0;position:relative"><b style="position:absolute;top:-22px;width:100%;text-align:center">${n}</b></div>`).join("")}</div>
   <div class="legend"><span><i class="dot" style="background:#2689e8"></i> الروضة</span><span><i class="dot" style="background:#2db455"></i> الأساسي</span><span><i class="dot" style="background:#8149d8"></i> الإعدادية</span></div>
  </div></div>
  <div class="panel"><div class="ptitle">◷ الحضور اليومي</div><div class="pbody"><div class="donutwrap"><div class="donut" style="background:conic-gradient(#21a45a 0 ${hp}%,#e53935 ${hp}% ${hp+ap}%,#f5b82b ${hp+ap}% 100%)"></div><div class="donuttext" style="position:absolute;inset:0;display:grid;place-items:center">${st.length||200}<small style="display:block;font-size:9px">إجمالي الطلاب</small></div></div><div class="donutlegend"><div class="dl"><span>🟢 حاضر</span><b>${h} (${hp}%)</b></div><div class="dl"><span>🔴 غائب</span><b>${abs} (${ap}%)</b></div><div class="dl"><span>🟡 متأخر</span><b>${late}</b></div></div></div></div>
  <div class="panel"><div class="ptitle">🔔 التنبيهات <a>عرض الكل</a></div><div class="pbody">
   <div class="notice"><span class="ni">❗</span><span>${st.length?st.filter(x=>x.status==="فعال").length:0} طالب فعال في النظام<br><small>معلومات التسجيل</small></span></div>
   <div class="notice"><span class="ni">💰</span><span>${db.fees.filter(x=>(+x.remaining||0)>0).length} سجل رسوم لديه متبقي<br><small>يتطلب متابعة</small></span></div>
   <div class="notice"><span class="ni">📝</span><span>${db.exams.length} امتحان مسجل<br><small>الامتحانات القادمة</small></span></div>
   <div class="notice"><span class="ni">📊</span><span>${db.grades.length} درجة مدخلة<br><small>نتائج الطلاب</small></span></div>
  </div></div>
 </div>
